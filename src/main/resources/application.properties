spring.application.name=Quarkus Extension Registry
registry.application.version=@buildNumber@

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/registrydb
spring.datasource.username=postgresql
spring.datasource.password=postgresql

# JPA / Hibernate
# The schema is owned by Flyway, Hibernate must never touch it
spring.jpa.hibernate.ddl-auto=none
# Keeps the physical column names produced by the Flyway schema (platform_stream_id, version_sortable, ...)
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# Second-level cache for the @Cacheable entities (Category, Platform), which Quarkus enabled by
# default. Spring Boot has no built-in provider, so Hibernate is pointed at Caffeine via JCache.
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=jcache
spring.jpa.properties.hibernate.javax.cache.provider=com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
spring.jpa.properties.hibernate.javax.cache.missing_cache_strategy=create
# Hibernate only honours @Cacheable when the JPA shared-cache mode selects it; Quarkus defaulted to
# ENABLE_SELECTIVE with a read-write strategy, Spring Boot leaves both unset.
spring.jpa.properties.jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE
spring.jpa.properties.hibernate.cache.default_cache_concurrency_strategy=read-write
#spring.jpa.show-sql=true

# Uncomment the following if you have a local database running
#spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
#spring.datasource.username=registry_test
#spring.datasource.password=registry_test

# Flyway runs the migrations at startup
spring.flyway.enabled=true
# Ignoring Flyway validation during migration for now
spring.flyway.validate-on-migrate=false

# Turns off Bad request stacktraces from the log
logging.level.org.jboss.resteasy.resteasy_jaxrs.i18n=OFF

#Log HTTP accesses, through the application log (io.quarkus.registry.web.AccessLogFilter), except /q/*
registry.access-log.enabled=true
registry.access-log.exclude-pattern=/q/.*

# OpenAPI
# springdoc builds the document here; /q/openapi, /q/openapi.yaml and /q/openapi.json are served by
# OpenApiDocumentController in the formats SmallRye OpenAPI used.
springdoc.api-docs.path=/q/openapi-springdoc
springdoc.swagger-ui.path=/q/swagger-ui
springdoc.swagger-ui.enabled=true
registry.openapi.title=Quarkus Extension Registry API
registry.openapi.version=1.0.0
registry.openapi.description=Catalog of Quarkus extensions
registry.openapi.contact.email=quarkus-dev@googlegroups.com
registry.openapi.contact.name=Quarkus team
registry.openapi.contact.url=https://github.com/quarkusio/registry.quarkus.io

# Management endpoints: only the Prometheus scrape, at the original /q/metrics path. The /q/health
# endpoints are served in the MicroProfile Health format by io.quarkus.registry.app.health, not by Actuator.
management.endpoints.web.base-path=/q
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.path-mapping.prometheus=metrics

# A database outage must surface within seconds (readiness DOWN, API 500), not after Hikari's 30 s default.
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000

# Disable sentry by default (no DSN configured means the Sentry integration stays inactive)
sentry.dsn=
sentry.in-app-includes=io.quarkus.registry
sentry.release=@buildNumber@

# Vert.x accepted request headers up to 20 KiB and request lines up to 4 KiB, and answered 431 and 414
# beyond them (RequestLineFilter). Tomcat's own 8 KiB limit would refuse such requests earlier, with 400.
server.max-http-request-header-size=64KB
# A refused oversized body is not drained
server.tomcat.max-swallow-size=0

# The application renders its own error payloads
server.error.whitelabel.enabled=false
